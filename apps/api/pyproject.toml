[project]
name = "tutor-api"
version = "0.1.0"
description = "Spanish Tutor core API."
requires-python = ">=3.12"
dependencies = [
  "tutor-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "anthropic>=0.75",
  "tzdata>=2024.1",
]

[tool.uv.sources]
tutor-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_api"]
