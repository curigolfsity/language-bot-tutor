[project]
name = "tutor-telegram"
version = "0.1.0"
description = "Thin Telegram client for the Spanish Tutor API."
requires-python = ">=3.12"
dependencies = [
  "tutor-contracts",
  "python-telegram-bot>=21.6",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
]

[tool.uv.sources]
tutor-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_telegram"]
