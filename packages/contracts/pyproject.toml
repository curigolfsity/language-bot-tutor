[project]
name = "tutor-contracts"
version = "0.1.0"
description = "Shared API DTOs (the API contract) for Spanish Tutor clients and server."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_contracts"]
